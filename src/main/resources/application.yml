spring:
  application:
    name: user-service
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: ${DATABASE_SCHEMA}
    open-in-view: false
  liquibase:
    enabled: true
    change-log: db/changelog/changelog.yml
    default-schema: ${DATABASE_SCHEMA}
  data:
    web:
      pageable:
        serialization-mode: via_dto
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2000ms}
      lettuce:
        pool:
          enabled: ${REDIS_POOL_ENABLED:true}
          max-active: ${REDIS_POOL_MAX_ACTIVE:32}
          max-idle: ${REDIS_POOL_MAX_IDLE:16}
          min-idle: ${REDIS_POOL_MIN_IDLE:8}
          max-wait: ${REDIS_POOL_MAX_WAIT:1000ms}
app:
  cache:
    lifecycle:
      default: ${CACHE_DEFAULT:1h}
      user-info: ${CACHE_USER_INFO:24h}
      card-info: ${CACHE_CARD_INFO:6h}
      user-cards: ${CACHE_USER_CARDS:12h}