spring:
  profiles:
    active: local
  application:
    name: user-service
  threads:
    virtual:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: ${DATABASE_SCHEMA}
        default_batch_fetch_size: 50
    open-in-view: false
  liquibase:
    enabled: true
    change-log: db/changelog/changelog.yml
    default-schema: ${DATABASE_SCHEMA}
  data:
    web:
      pageable:
        serialization-mode: via_dto
    redis:
      timeout: ${REDIS_TIMEOUT:2000ms}
      lettuce:
        pool:
          enabled: ${REDIS_POOL_ENABLED:true}
          max-active: ${REDIS_POOL_MAX_ACTIVE:32}
          max-idle: ${REDIS_POOL_MAX_IDLE:16}
          min-idle: ${REDIS_POOL_MIN_IDLE:8}
          max-wait: ${REDIS_POOL_MAX_WAIT:1000ms}
logbook:
  format:
    style: http
  obfuscate:
    headers:
      - Authorization
      - X-Secret-Key
    json-body-fields:
      - password
      - number