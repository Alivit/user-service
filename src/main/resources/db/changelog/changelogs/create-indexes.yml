databaseChangeLog:
  - logicalFilePath: db/changelog/changes/create-indexes.yml
  - changeSet:
      id: 3
      author: Chuiko Vitali
      dbms: postgresql
      changes:
        - sql:
            sql: "CREATE EXTENSION IF NOT EXISTS pg_trgm"
  - changeSet:
      id: 4
      author: Chuiko Vitali
      dbms: postgresql
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_users_surname_trgm
              tableName: users
      changes:
        - sql:
            sql: "CREATE INDEX idx_users_surname_trgm ON users USING gin (surname gin_trgm_ops)"
      rollback:
        - sql:
            sql: "DROP INDEX IF EXISTS idx_users_surname_trgm"
  - changeSet:
      id: 5
      author: Chuiko Vitali
      dbms: postgresql
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_users_name_trgm
              tableName: users
      changes:
        - sql:
            sql: "CREATE INDEX idx_users_name_trgm ON users USING gin (name gin_trgm_ops);"
      rollback:
        - sql:
            sql: "DROP INDEX IF EXISTS idx_users_name_trgm"
  - changeSet:
      id: 6
      author: Chuiko Vitali
      dbms: postgresql
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: uk_users_email
              tableName: users
      changes:
        - sql:
            sql: "CREATE UNIQUE INDEX uk_users_email_lower ON users (LOWER(email)) WHERE deleted = false;"
      rollback:
        - sql:
            sql: "DROP INDEX IF EXISTS uk_users_email_lower;"
  - changeSet:
      id: 7
      author: Chuiko Vitali
      dbms: postgresql
      preConditions:
        - onFail: MARK_RAN
        - not:
            indexExists:
              indexName: idx_users_email_lower_history
              tableName: users
      changes:
        - sql:
            sql: "CREATE INDEX idx_users_email_lower_history ON users (LOWER(email));"
      rollback:
        - sql:
            sql: "DROP INDEX IF EXISTS idx_users_email_lower_history;"



