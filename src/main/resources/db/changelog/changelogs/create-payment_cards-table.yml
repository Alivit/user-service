databaseChangeLog:
  - logicalFilePath: db/changelog/changelogs/create-payment_cards-table.yml
  - changeSet:
      id: 2
      author: Chuiko Vitali
      changes:
        - createTable:
            tableName: payment_cards
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    foreignKeyName: fk_user_id
                    nullable: false
                    references:
                      users(id)
              - column:
                  name: number
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: card_hash
                  type: varchar(64)
                  constraints:
                    unique: true
                    nullable: false
              - column:
                  name: holder
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: expiration_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamp
