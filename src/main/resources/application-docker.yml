spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://user-postgres:${USER_POSTGRES_PORT}/${USER_DB_NAME}?currentSchema=${USER_DB_SCHEMA}
    username: ${USER_DB_USERNAME}
    password: ${USER_DB_PASSWORD}
    hikari:
      maximum-pool-size: 32
      minimum-idle: 8
      connection-timeout: 15000
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false
  data:
    redis:
      host: redis
      port: ${REDIS_PORT}
  security:
    oauth2:
      client:
        registration:
          user-service-internal:
            provider: keycloak
            client-id: ${APP_CLIENT_ID}
            client-authentication-method: none
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: https://keycloak:${KC_HTTPS_PORT}/realms/${APP_REALM}/protocol/openid-connect/token
      resourceserver:
        jwt:
          jwk-set-uri: https://keycloak:${KC_HTTPS_PORT}/realms/${APP_REALM}/protocol/openid-connect/certs
          issuer-uri: https://keycloak:${KC_HTTPS_PORT}/realms/${APP_REALM}
          audience: ${APP_CLIENT_ID}
  ssl:
    bundle:
      pem:
        keycloak-mtls:
          keystore:
            certificate: "file:/app/certs/auth-client.crt"
            private-key: "file:/app/certs/auth-client.key"
          truststore:
            certificate: "file:/app/certs/root-ca.crt"
  grpc:
    client:
      channels:
        auth-service-grpc:
          address: 'auth-service:${AUTH_GRPC_SERVER_PORT}'
          negotiation-type: plaintext
    server:
      port: ${USER_GRPC_SERVER_PORT}
      reflection:
        enabled: true

decorator:
  datasource:
    datasource-proxy:
      query:
        enable-logging: false
      slow-query:
        enable-logging: true
        log-level: warn

logging:
  level:
    root: INFO
    com.minispring.userservice: INFO
    org.hibernate.SQL: OFF
    org.zalando.logbook: OFF