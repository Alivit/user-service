spring:
  application:
    name: user-service-test

  datasource: {}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    open-in-view: false

  liquibase:
    enabled: true
    change-log: db/changelog/changelog.yml
    default-schema: public

  task:
    execution:
      pool:
        core-size: 0
        max-size: 1
        queue-capacity: 0
      thread-name-prefix: test-sync-task-

  data:
    redis:
      timeout: 1000ms
      lettuce:
        pool:
          enabled: true
          max-active: 8
          max-idle: 4
          min-idle: 2
          max-wait: 500ms

app:
  cache:
    lifecycle:
      default: 1m
      user-info: 5m
  audit:
    enabled: ${APP_AUDIT_ENABLED:true}