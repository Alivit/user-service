services:
  user-postgres:
    image: postgres:18-alpine
    container_name: user-postgres
    environment:
      POSTGRES_DB: ${DATABASE_DB}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_SCHEMA: ${DATABASE_SCHEMA}
      APP_DB_USER: ${DOCKER_DB_USER}
      APP_DB_PASSWORD: ${DOCKER_DB_PASSWORD}
    volumes:
        - ./docker-init/init-app-user.sh:/docker-entrypoint-initdb.d/init-app-user.sh
        - pg_data:/var/lib/postgresql
    ports:
      - "5432:5432"

  redis:
    image: redis:7.4-alpine
    container_name: redis
    ports:
      - "6379:6379"

  user-service:
    build: .
    container_name: user-service
    depends_on:
        - user-postgres
        - redis
    env_file:
      - '.env'
    environment:
      SERVER_PORT: 8081
      SPRING_PROFILES_ACTIVE: docker
      DB_QUERY_LOGGING_ENABLED: ${DB_QUERY_LOGGING_ENABLED}
      DB_SLOW_QUERY_LOGGING_ENABLED: ${DB_SLOW_QUERY_LOGGING_ENABLED}
      LOG_LEVEL_APP: ${LOG_LEVEL_APP}
      LOG_LEVEL_HIBERNATE: ${LOG_LEVEL_HIBERNATE}
      LOG_LEVEL_LOGBOOK: ${LOG_LEVEL_LOGBOOK}
      APP_AUDIT_ENABLED: ${APP_AUDIT_ENABLED}
    ports:
      - "8081:8081"
networks:
  default:
    name: minispring-network
    external: true
volumes:
  pg_data: